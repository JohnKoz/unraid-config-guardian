name: Publish Fork Image

# Manual-only workflow for building/publishing this fork's own images to
# a personal Docker Hub account, independent of the upstream ci-cd.yml
# pipeline (which is hardcoded to stephondoestech/unraid-config-guardian).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build"
        required: true
        default: "main"
      tag:
        description: "Docker tag to publish as"
        required: true
        default: "fork-fix"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/unraid-config-guardian:${{ github.event.inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
